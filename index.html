<!DOCTYPE html>
<html>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;padding:20px">
  <h2 style="color:#38bdf8">Mod-12 Prime Analyzer</h2>
  <input id="n" value="5000" style="padding:10px;font-size:18px">
  <button onclick="run()" style="padding:10px 20px;font-size:18px;background:#38bdf8;border:none;font-weight:bold">Hesapla</button>
  <h3 id="out" style="color:#fbbf24;margin-top:20px">Bekleniyor...</h3>

  <script>
    function run() {
      var limit = Number(document.getElementById("n").value);
      var count = 0;
      for (var i = 2; i <= limit; i++) {
        var prime = true;
        for (var j = 2; j * j <= i; j++) {
          if (i % j === 0) { prime = false; break; }
        }
        if (prime) count++;
      }
      document.getElementById("out").innerText = "Toplam Asal: " + count;
    }
    run();
  </script>
</body>
</html>
