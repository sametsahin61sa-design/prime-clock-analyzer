<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod-12 Clock Orbit & Division-Free Prime Analyzer | Samet Şahin</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --gold: #fbbf24;
            --green: #34d399;
            --purple: #a78bfa;
            --red: #f87171;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; font-size: 1.35rem; color: var(--accent); }
        .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .lang-btn, .pro-badge-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .pro-badge-btn {
            border-color: var(--gold);
            color: var(--gold);
        }
        .pro-badge-btn.unlocked {
            background: rgba(52, 211, 153, 0.2);
            border-color: var(--green);
            color: var(--green);
        }
        .control-panel {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        input[type="text"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 1rem;
            width: 240px;
            font-family: monospace;
        }
        button.run-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button.excel-btn {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .mode-banner {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .mode-banner.big {
            background: rgba(251, 191, 36, 0.12);
            border-color: var(--gold);
            color: var(--gold);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            word-break: break-word;
        }
        .card h3 { margin: 0 0 6px 0; font-size: 0.85rem; color: var(--muted); }
        .card .val { font-size: 1.35rem; font-weight: bold; color: var(--text); font-family: monospace; }
        .card .sub { font-size: 0.78rem; color: var(--accent); margin-top: 4px; }
        .visual-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .canvas-box {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .canvas-box h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--gold); text-align: left; }
        canvas {
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            max-width: 100%;
            height: auto;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 0.8rem;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .section-title {
            font-size: 1.1rem;
            color: var(--gold);
            margin: 20px 0 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filter-group select {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .excel-wrapper {
            max-height: 420px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
        }
        table.excel-table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 0.85rem;
            text-align: left;
        }
        table.excel-table th {
            background: #0b1120;
            color: var(--accent);
            position: sticky;
            top: 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            z-index: 2;
        }
        table.excel-table td {
            padding: 7px 12px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }
        table.excel-table tr:nth-child(even) { background: rgba(15, 23, 42, 0.4); }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .b-mersenne { background: rgba(251, 191, 36, 0.2); color: var(--gold); border: 1px solid var(--gold); }
        .b-fermat { background: rgba(52, 211, 153, 0.2); color: var(--green); border: 1px solid var(--green); }
        .b-euler { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .b-sophie { background: rgba(167, 139, 250, 0.2); color: var(--purple); border: 1px solid var(--purple); }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-box {
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 25px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-box h2 { color: var(--gold); margin-top: 0; font-size: 1.3rem; }
        .modal-box p { color: var(--muted); font-size: 0.9rem; }
        .modal-box ul { text-align: left; color: var(--text); font-size: 0.88rem; margin: 15px 0; padding-left: 20px; }
        .modal-box li { margin-bottom: 6px; }
        .license-input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-family: monospace;
            text-align: center;
            font-size: 0.95rem;
        }
        .modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn-buy {
            background: var(--gold);
            color: #000;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-verify {
            background: var(--green);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-close {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
        }
        footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 0.82rem;
            color: var(--muted);
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
